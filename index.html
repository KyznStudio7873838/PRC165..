.wb-silhouette{position:absolute;bottom:0;left:0;right:0;height:38%;z-index:1;pointer-events:none;background:linear-gradient(180deg,transparent 0%,rgba(30,5,20,.7) 100%),radial-gradient(ellipse at 15% 100%,#2a0518 0%,transparent 22%),radial-gradient(ellipse at 40% 100%,#2a0518 0%,transparent 25%),radial-gradient(ellipse at 65% 100%,#2a0518 0%,transparent 28%)}
.wb-papel{position:absolute;top:0;left:0;right:0;height:20px;z-index:2;pointer-events:none;background-image:radial-gradient(circle at 50% 0,transparent 6px,rgba(255,213,79,.5) 6px,rgba(255,213,79,.5) 7px,transparent 7px);background-size:20px 20px;background-repeat:repeat-x;opacity:.5}
.wb-top{position:relative;z-index:20;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-top) + 8px) 12px 6px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent)}
.wb-top .btn-back{width:40px;height:40px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 35% 30%,#5c4a2a,#2a1a05);color:var(--gold);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 0 12px var(--gold-glow)}
.wb-top .btn-back:active{transform:scale(.9)}

}

const storage = {
  get(k, f) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : f; } catch(e) { return f; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} },
  del(k) { try { localStorage.removeItem(k); } catch(e) {} }
};

   AUDIO
   ============================================================ */
const Audio = {
  ctx: null, musicGain: null, sfxGain: null,
  musicOn: false, currentSeq: null, initialized: false,
  init() {
    if (this.initialized) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.03;
      this.musicGain.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.11;
      this.sfxGain.connect(this.ctx.destination);
      this.initialized = true;
    } catch(e) {}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d, t, v, w) {
    t = t || 'sine'; v = v || 0.2; w = w || 0;
    if (!this.ctx) return;
    const a = this.ctx.currentTime + w;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = t; o.frequency.value = f;
    g.gain.setValueAtTime(0, a);
    g.gain.linearRampToValueAtTime(v, a + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, a + d);
    o.connect(g); g.connect(this.sfxGain);
    o.start(a); o.stop(a + d + 0.05);
  },
  noise(d, v, w) {
    v = v || 0.15; w = w || 0;
    if (!this.ctx) return;
    const a = this.ctx.currentTime + w;
    const b = this.ctx.createBuffer(1, this.ctx.sampleRate * d, this.ctx.sampleRate);
    const dt = b.getChannelData(0);
    for (let i = 0; i < dt.length; i++) dt[i] = Math.random() * 2 - 1;
    const s = this.ctx.createBufferSource(); s.buffer = b;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(v, a);
    g.gain.exponentialRampToValueAtTime(0.001, a + d);
    s.connect(g); g.connect(this.sfxGain);
    s.start(a);
  },
  click() { this.tone(880, 0.04, 'square', 0.07); },
  toggle() { this.tone(660, 0.06, 'sine', 0.12); },
  loaderTick() { this.tone(1200, 0.03, 'square', 0.05); },
  tick() { this.tone(1400, 0.02, 'square', 0.04); },
  spinStart() { for (let i = 0; i < 6; i++) this.tone(320 + i * 100, 0.06, 'triangle', 0.09, i * 0.04); },
  tileLand() { this.noise(0.04, 0.07); this.tone(420 + Math.random() * 220, 0.06, 'triangle', 0.07); },
  land() { this.tone(500, 0.08, 'triangle', 0.1); },
  spin() { this.tone(280, 0.05, 'triangle', 0.08); },
  win() { [523.25, 659.25, 783.99, 1046.5].forEach((n, i) => this.tone(n, 0.25, 'sine', 0.18, i * 0.07)); },
  lose() { this.tone(280, 0.18, 'sawtooth', 0.13); this.tone(180, 0.25, 'sawtooth', 0.13, 0.13); },
  crash() { this.noise(0.35, 0.18); this.tone(90, 0.4, 'sawtooth', 0.18); },
  cashout() { this.tone(1046.5, 0.13, 'sine', 0.18); this.tone(1318.5, 0.13, 'sine', 0.18, 0.09); },
  jackpot() { [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093, 2637].forEach((n, i) => this.tone(n, 0.13, 'square', 0.16, i * 0.045)); },
  achievement() { [659.25, 783.99, 1046.5, 1318.5].forEach((n, i) => this.tone(n, 0.25, 'sine', 0.18, i * 0.09)); },
  missionComplete() { this.tone(1046.5, 0.18, 'sine', 0.18); this.tone(1318.5, 0.18, 'sine', 0.18, 0.13); this.tone(1567.98, 0.3, 'sine', 0.18, 0.26); },
  coinDrop() { this.tone(1200, 0.08, 'sine', 0.14); this.tone(1600, 0.1, 'sine', 0.12, 0.06); this.tone(2000, 0.12, 'sine', 0.1, 0.12); },
  bigWin() { [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093].forEach((n, i) => this.tone(n, 0.22, 'triangle', 0.18, i * 0.06)); },
  freeSpin() { [880, 1046.5, 1318.5, 1567.98].forEach((n, i) => this.tone(n, 0.2, 'sine', 0.15, i * 0.1)); },
  infinitySfx() { [261.63, 329.63, 392, 523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98, 2093].forEach((n, i) => this.tone(n, 0.35, 'triangle', 0.2, i * 0.12)); },
  toggleMusic() {
    if (!this.initialized) this.init();
    this.resume();
    this.musicOn = !this.musicOn;
    if (this.musicOn) this.startMusic(); else this.stopMusic();
    return this.musicOn;
  },
  startMusic() {
    if (!this.ctx || !this.musicOn) return;
    this.stopMusic();
    const b = [130.81, 130.81, 164.81, 164.81, 196, 196, 174.61, 174.61];
    const m = [523.25, 659.25, 783.99, 659.25, 523.25, 587.33, 698.46, 587.33];
    let i = 0;
    const self = this;
    function step() {
      if (!self.musicOn || !self.ctx) return;
      const t = self.ctx.currentTime;
      const bo = self.ctx.createOscillator(); const bg = self.ctx.createGain();
      bo.type = 'triangle'; bo.frequency.value = b[i % 8];
      bg.gain.setValueAtTime(0, t);
      bg.gain.linearRampToValueAtTime(0.09, t + 0.02);
      bg.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
      bo.connect(bg); bg.connect(self.musicGain);
      bo.start(t); bo.stop(t + 0.45);
      const mo = self.ctx.createOscillator(); const mg = self.ctx.createGain();
      mo.type = 'sine'; mo.frequency.value = m[i % 8];
      mg.gain.setValueAtTime(0, t);
      mg.gain.linearRampToValueAtTime(0.04, t + 0.05);
      mg.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      mo.connect(mg); mg.connect(self.musicGain);
      mo.start(t); mo.stop(t + 0.55);
      i++;
      self.currentSeq = setTimeout(step, 500);
    }
    step();
  },
  stopMusic() { if (this.currentSeq) { clearTimeout(this.currentSeq); this.currentSeq = null; } },
  stopAll() { this.stopMusic(); this.musicOn = false; if (this.ctx && this.ctx.state === 'running') this.ctx.suspend(); }
};

function animateNumber(el, from, to, dur, onTick) {
  dur = dur || 900;
  const s = performance.now();
  const d = to - from;
  function f(t) {
    const p = Math.min(1, (t - s) / dur);
    const e = 1 - Math.pow(1 - p, 3);
    const v = Math.round(from + d * e);
    if (el) el.textContent = v.toLocaleString('id-ID');
    if (onTick) onTick(v, p);
    if (p < 1) requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
}
function createConfetti() {

    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];

    p.style.animationDuration = (2 + Math.random() * 2) + 's';

function getVIPTier(tb) { for (let i = VIP_TIERS.length - 1; i >= 0; i--) if (tb >= VIP_TIERS[i].min) return VIP_TIERS[i]; return VIP_TIERS[0]; }
function getVIPProgress(tb) { const t = getVIPTier(tb); if (t.max === Infinity) return 100; return Math.min(100, ((tb - t.min) / (t.max - t.min)) * 100); }
function getWalletTier(tw) { for (let i = WALLET_TIERS.length - 1; i >= 0; i--) if (tw >= WALLET_TIERS[i].min) return WALLET_TIERS[i]; return WALLET_TIERS[0]; }
function getWalletTierProgress(tw) { const t = getWalletTier(tw); if (t.max === Infinity) return 100; return Math.min(100, ((tw - t.min) / (t.max - t.min)) * 100); }

function initSpaceCanvas() {
  spaceCanvas = document.getElementById('spaceCanvas');
  if (!spaceCanvas) return;
  spaceCtx = spaceCanvas.getContext('2d');
  function resize() {
    if (!spaceCanvas || !spaceCtx) return;
    const dpr = window.devicePixelRatio || 1;
    const w = spaceCanvas.clientWidth || window.innerWidth;
    const h = spaceCanvas.clientHeight || window.innerHeight;
    spaceCanvas.width = w * dpr;
    spaceCanvas.height = h * dpr;
    spaceCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  if (spaceResizeHandler) window.removeEventListener('resize', spaceResizeHandler);
  spaceResizeHandler = resize;
  window.addEventListener('resize', spaceResizeHandler);
  spaceStars = [];
  for (let i = 0; i < 100; i++) {
    spaceStars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.5 + 0.3, s: 0.2 + Math.random() * 1.5, a: 0.3 + Math.random() * 0.7 });
  }
  spaceParticles = [];
  function draw() {
    if (!spaceCtx || !spaceCanvas) return;
    const w = spaceCanvas.clientWidth || window.innerWidth;
    const h = spaceCanvas.clientHeight || window.innerHeight;
    spaceCtx.clearRect(0, 0, w, h);
    spaceStars.forEach(s => {
      s.y += s.s * 0.0015;
      if (s.y > 1) { s.y = 0; s.x = Math.random(); }
      spaceCtx.globalAlpha = s.a;
      spaceCtx.fillStyle = '#fff';
      spaceCtx.beginPath();
      spaceCtx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
      spaceCtx.fill();
    });
    spaceCtx.globalAlpha = 1;
    spaceParticles = spaceParticles.filter(p => p.life > 0);
    spaceParticles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.02;
      spaceCtx.globalAlpha = Math.max(0, p.life);
      spaceCtx.fillStyle = p.color;
      spaceCtx.beginPath();

function generateMjGrid(tk, isWin, spinning) {
  const T = THEMES[tk];
  const g = document.getElementById('mjGrid');
  if (!g) return;
  g.innerHTML = '';
  for (let i = 0; i < 20; i++) {
    const t = document.createElement('div');
    t.className = 'mj-tile ' + T.tileCls;
    if (spinning) t.classList.add('spin');
    t.style.animationDelay = (i * 0.02) + 's';
    const r = Math.random();
    if (r < 0.01) { t.classList.add('blackdragon'); t.innerHTML = T.wildIcon; t.dataset.sym = 'wild'; }
    else if (r < 0.06) { t.classList.add('scatter'); t.innerHTML = T.scatterIcon; t.dataset.sym = 'scatter'; }
    else if (r < 0.20) { t.classList.add('wild'); t.innerHTML = 'WILD'; t.dataset.sym = 'wild'; }
    else { t.innerHTML = T.symbols[Math.floor(Math.random() * T.symbols.length)]; }
    if (isWin && i < 8) t.classList.add('win');
    g.appendChild(t);
  }
}
function setMjMult(v) {
  ['mjM1','mjM2','mjM3','mjM5'].forEach(id => { const e = document.getElementById(id); if (e) e.classList.remove('active'); });
  const m = { 1: 'mjM1', 2: 'mjM2', 3: 'mjM3', 5: 'mjM5' };
  const e = document.getElementById(m[Math.min(v, 5)] || 'mjM1');
  if (e) e.classList.add('active');
}
function spinMahjong(tk) {
  const m = state.mahjong, u = state.currentUser;
  const T = THEMES[tk];
  if (m.spinning) return;
  if (m.freeSpins > 0) {
    m.freeSpins--;
    toast('FREE SPIN! SISA: ' + m.freeSpins, 'info');
  } else {
    if (u.balance < m.bet) return toast('SALDO TIDAK CUKUP!', 'lose');
    const old = u.balance;
    u.balance -= m.bet;
    syncBalance();
    animateBalanceChange(old, u.balance);
    document.querySelectorAll('[data-balance]').forEach(el => { el.textContent = u.balance.toLocaleString('id-ID'); });
    progressMission('bet', m.bet);
    progressMission('spin', 1);
    state.stats.totalBet = (state.stats.totalBet || 0) + m.bet;
    saveProgress();
  }
  Audio.spinStart();
  m.spinning = true;
  const b = document.getElementById('mjSpinBtn');
  if (b) b.disabled = true;
  let c = 0;
  if (mjSpinInterval) clearInterval(mjSpinInterval);
  mjSpinInterval = setInterval(() => {
    generateMjGrid(tk, false, true);
    if (c % 3 === 0) Audio.tileLand();
    c++;
    if (c >= 14) {
      clearInterval(mjSpinInterval);
      mjSpinInterval = null;
      const r = Math.random();
      let win = 0, mult = 1, msg = '', jp = false;
      if (r < 0.005) {
        win = m.bet * 100; mult = 100; jp = true;
        msg = tk === 'zeus' ? 'ZEUS JACKPOT!' : 'TREASURE JACKPOT!';
      } else if (r < 0.30) {
        const ms = T.multipliers;
        mult = ms[Math.floor(Math.random() * ms.length)];
        win = m.bet * mult;
        msg = 'MENANG x' + mult;
      }
      if (win > 0) {
        const old = u.balance;
        u.balance += win;
        const ws = winToWallet(win);
        syncBalance();
        animateBalanceChange(old, u.balance);
        document.querySelectorAll('[data-balance]').forEach(el => { el.textContent = u.balance.toLocaleString('id-ID'); });
        generateMjGrid(tk, true, false);
        setMjMult(mult);
        progressMission('win', 1);
        state.stats.totalWin = (state.stats.totalWin || 0) + win;
        saveProgress();
        if (jp) {
          state.stats.jackpots = (state.stats.jackpots || 0) + 1;
          progressMission('jackpot', 1);
          saveProgress();
          const be = document.getElementById('boltEffect');
          if (be) { be.classList.add('flash'); setTimeout(() => be.classList.remove('flash'), 400); }
          Audio.jackpot();
          coinBurst('up', 26); coinRain(50);
          amountTag('up', '+' + win.toLocaleString('id-ID'));
          showWin(msg, '+Rp ' + win.toLocaleString('id-ID') + (ws > 0 ? ' +' + ws + ' WC' : ''), true);
          toast(msg, 'gold');
          createConfetti();
          checkAchievement('first_jackpot');
        } else {
          Audio.win();
          coinBurst('up', 12);
          amountTag('up', '+' + win.toLocaleString('id-ID'));
          showWin(msg, '+Rp ' + win.toLocaleString('id-ID') + (ws > 0 ? ' +' + ws + ' WC' : ''), false);
          toast(msg, 'win');
          checkAchievement('first_win');
        }
        showGreenBar('+Rp ' + win.toLocaleString('id-ID'));
        const e = document.getElementById('mjWin');
        if (e) e.textContent = win.toLocaleString('id-ID');
        state.history.push({ username: u.username, game: T.gameName, win: win, time: new Date().toLocaleTimeString(), jackpot: jp });
        saveHistory();
      } else {
        generateMjGrid(tk, false, false);
        setMjMult(1);
        Audio.lose();
        state.history.push({ username: u.username, game: T.gameName, win: -m.bet, time: new Date().toLocaleTimeString(), jackpot: false });
        saveHistory();
      }
      const sc = document.querySelectorAll('#mjGrid .mj-tile[data-sym="scatter"]').length;
      if (sc >= 3) {
        m.freeSpins += 10;
        Audio.freeSpin();
        toast('FREE SPIN! +10 (' + m.freeSpins + ')', 'win');
      }
      m.spinning = false;
      if (b) b.disabled = false;
      checkMissionComplete();
      setTimeout(() => { if (!m.spinning) setMjMult(1); }, 2000);
    }
  }, 55);
}

function wbRandomSymbol() {
  const total = BANDITO_SYMBOLS.reduce((s, x) => s + x.weight, 0);
  let r = Math.random() * total;
  for (const s of BANDITO_SYMBOLS) { r -= s.weight; if (r <= 0) return s; }
  return BANDITO_SYMBOLS[0];
}
function wbMakeTile(sym, spinning, isWin) {
  const t = document.createElement('div');
  t.className = 'wb-tile';
  if (spinning) t.classList.add('spin');
  if (isWin) t.classList.add('win');
  t.dataset.sym = sym.id;
  t.innerHTML = sym.icon;
  return t;
}
function wbFillGrid(spinning, winIndices) {
  const g = document.getElementById('wbTileGrid');
  if (!g) return;
  g.innerHTML = '';
  for (let i = 0; i < 15; i++) {
    const sym = wbRandomSymbol();
    const t = wbMakeTile(sym, spinning, winIndices && winIndices.includes(i));
    t.style.animationDelay = (i * 0.018) + 's';
    g.appendChild(t);
  }
}

function wbSpin() {
  const b = state.bandito;
  if (b.spinning) return;
  const cost = b.freeSpins > 0 ? 0 : b.bet;
  if (b.balance < cost) { toast('SALDO TIDAK CUKUP!', 'lose'); return; }
  b.spinning = true;
  const spinBtn = document.getElementById('wbSpinBtn');
  if (spinBtn) { spinBtn.disabled = true; spinBtn.classList.add('spinning'); }
  wbClearMultiplier();
  if (b.freeSpins > 0) { b.freeSpins--; }
  else { b.balance -= b.bet; }
  wbUpdateUI();
  Audio.spin();
  const willInfinity = Math.random() < 0.03;
  const targetMult = willInfinity ? 'inf' : [1, 2][Math.floor(Math.random() * 2)];
  let ticks = 0;
  const total = b.turbo ? 8 : 16;
  const spinIv = setInterval(() => {
    wbFillGrid(true);
    if (ticks % 3 === 0) { Audio.tick(); if (navigator.vibrate) navigator.vibrate(8); }
    ticks++;
    if (ticks >= total) {
      clearInterval(spinIv);
      Audio.land();
      setTimeout(() => {
        wbSetMultiplier(targetMult);
        wbResolveSpin(willInfinity, targetMult);
      }, 400);
    }
  }, b.turbo ? 45 : 65);
}

function wbResolveSpin(willInfinity, targetMult) {
  const b = state.bandito;
  const r = Math.random();
  let win = 0, msg = '', isJackpot = false, isBigWin = false;
  const winIndices = [];
  if (willInfinity) {
    win = b.bet * 100; isJackpot = true; msg = '∞ INFINITY JACKPOT!';
    for (let i = 0; i < 15; i++) winIndices.push(i);
    setTimeout(() => wbShowInfinityPopup(), 200);
  } else if (r < 0.005) {
    win = b.bet * 50; isJackpot = true; msg = 'GRAND JACKPOT!';
    for (let i = 0; i < 15; i++) winIndices.push(i);
  } else if (r < 0.04) {
    win = b.bet * 20; isBigWin = true; msg = 'MAJOR WIN!';
    const cnt = 10 + Math.floor(Math.random() * 5);
    const picked = new Set();
    while (picked.size < cnt) picked.add(Math.floor(Math.random() * 15));
    picked.forEach(i => winIndices.push(i));
  } else if (r < 0.35) {
    b.streak++;
    const bonus = Math.min(b.streak, 3);
    win = b.bet * bonus;
    msg = b.streak > 1 ? 'COMBO x' + b.streak : 'MENANG!';
    const cnt = 4 + Math.floor(Math.random() * 5);
    const picked = new Set();
    while (picked.size < cnt) picked.add(Math.floor(Math.random() * 15));
    picked.forEach(i => winIndices.push(i));
    if (win >= b.bet * 5) isBigWin = true;
  } else { b.streak = 0; }
  wbFillGrid(false, winIndices);
  const scatters = document.querySelectorAll('#wbTileGrid .wb-tile[data-sym="scatter"]').length;
  if (scatters >= 3) {
    b.freeSpins += 10;
    setTimeout(() => { Audio.freeSpin(); toast('FREE SPIN +10!', 'win'); }, 500);
  }
  if (win > 0) {
    b.balance += win;
    b.totalWin += win;
    if (win > b.bestWin) b.bestWin = win;
    wbUpdateUI();
    coinBurst('up', isJackpot ? 30 : isBigWin ? 22 : 14);
    amountTag('up', '+' + win.toLocaleString('id-ID'));
    if (isJackpot || isBigWin) createConfetti();
    showWinPopup(msg, '+Rp ' + win.toLocaleString('id-ID'), isJackpot);
    toast(msg + ' +' + win.toLocaleString('id-ID'), 'win');
    if (isJackpot) Audio.jackpot();
    else if (isBigWin) Audio.bigWin();
    else Audio.win();
    if (navigator.vibrate) navigator.vibrate(isJackpot ? [50, 30, 50, 30, 100] : [40]);
    b.history.unshift({ w: win, m: targetMult, jp: isJackpot });
    if (b.history.length > 10) b.history = b.history.slice(0, 10);
  } else {
    Audio.lose();
    toast('Coba lagi!', 'lose');
    b.history.unshift({ w: -b.bet, m: targetMult, jp: false });
    if (b.history.length > 10) b.history = b.history.slice(0, 10);
  }
  b.spinning = false;
  const spinBtn = document.getElementById('wbSpinBtn');
  if (spinBtn) { spinBtn.disabled = false; spinBtn.classList.remove('spinning'); }
  setTimeout(() => wbClearMultiplier(), 2500);
  if (b.autoCount > 0) {
    b.autoCount--;
    if (b.autoCount <= 0) { toast('Autoplay selesai', 'info'); }
    else { setTimeout(wbSpin, b.turbo ? 400 : 900); }
  }
}
