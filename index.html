<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>PRC165 — Situs Slot Gacor No.1 Indonesia | Bonus 100%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Poppins:wght@500;600;700;800;900&family=Rye&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PRC165 — FULL FIXED VERSION
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --bg:#08080a;--bg-2:#101014;--bg-3:#181820;--card:#1a1a22;--card-2:#22222c;
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --txt:#fff;--txt-dim:#a0a0b0;--txt-mute:#606070;
  --red:#ff2b2b;--red-2:#d40000;--red-glow:rgba(255,43,43,.55);
  --gold:#ffc107;--gold-2:#ff9800;--gold-3:#ff6f00;--gold-glow:rgba(255,193,7,.55);
  --green:#00c853;--green-2:#00a844;--green-glow:rgba(0,200,83,.55);
  --blue:#2196f3;--blue-2:#1565c0;--purple:#9c27b0;--pink:#e91e63;--cyan:#00bcd4;
  --grad-red:linear-gradient(135deg,#ff2b2b 0%,#d40000 100%);
  --grad-gold:linear-gradient(135deg,#ffd54f 0%,#ff9800 50%,#ff6f00 100%);
  --grad-green:linear-gradient(135deg,#69f0ae 0%,#00c853 50%,#00a844 100%);
  --grad-blue:linear-gradient(135deg,#64b5f6 0%,#2196f3 50%,#1565c0 100%);
  --grad-purple:linear-gradient(135deg,#ba68c8 0%,#9c27b0 100%);
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:76px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Montserrat',-apple-system,BlinkMacSystemFont,'Poppins',sans-serif;background:var(--bg);color:var(--txt);position:fixed;inset:0;-webkit-font-smoothing:antialiased;font-weight:500;overscroll-behavior:none}
#app{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:var(--nav-h);scrollbar-width:none}
#app::-webkit-scrollbar{display:none}
button{font-family:inherit;cursor:pointer;font-weight:700;letter-spacing:.3px}
svg{display:block}
input{font-family:inherit}
::selection{background:var(--gold);color:#000}
::-webkit-scrollbar{width:0}

/* ===== KEYFRAMES ===== */
@keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 8px var(--gold-glow))}50%{filter:drop-shadow(0 0 22px var(--gold-glow))}}
@keyframes shimmerX{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes bounceIn{0%{transform:scale(0);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@keyframes confettiFall{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
@keyframes coinFall{0%{transform:translateY(-20vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(540deg);opacity:.3}}
@keyframes ringOut{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.2);opacity:0}}
@keyframes scan{from{transform:translateY(-100%)}to{transform:translateY(100%)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.3}}
@keyframes stampIn{0%{transform:scale(3) rotate(-30deg);opacity:0}60%{transform:scale(.9) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,193,7,.7),0 6px 20px rgba(0,0,0,.5)}50%{box-shadow:0 0 0 14px rgba(255,193,7,0),0 6px 20px rgba(0,0,0,.5)}}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes jackpotCount{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes coinRise{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.05) rotate(540deg);opacity:0}}
@keyframes coinDropAway{0%{transform:translate(0,0) scale(.6) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.35) rotate(-480deg);opacity:0}}
@keyframes amountFloat{0%{transform:translateY(0) scale(.7);opacity:0}20%{transform:translateY(-8px) scale(1.06);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}
@keyframes receiptIn{0%{transform:translateY(30px) scale(.94);opacity:0}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes iconPop{0%{transform:scale(0) rotate(-180deg);opacity:0}70%{transform:scale(1.1) rotate(8deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes balancePulse{0%{transform:scale(1)}40%{transform:scale(1.14);filter:drop-shadow(0 0 14px currentColor)}100%{transform:scale(1);filter:drop-shadow(0 0 0 transparent)}}
@keyframes splashLoad{from{width:0}to{width:100%}}
@keyframes flash{0%,100%{opacity:0}50%{opacity:1}}
@keyframes tileIn{0%{opacity:0;transform:translateY(-22px) rotateX(75deg) scale(.7)}100%{opacity:1;transform:translateY(0) rotateX(0) scale(1)}}
@keyframes tileSpin{0%{transform:rotateY(0)}100%{transform:rotateY(360deg)}}
@keyframes winGlow{0%,100%{box-shadow:0 0 0 1px var(--gold),0 0 14px var(--gold-glow)}50%{box-shadow:0 0 0 1px var(--gold),0 0 26px var(--gold-glow)}}
@keyframes scrollLight{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes redPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,215,64,.8),0 8px 30px rgba(0,0,0,.6),inset 0 -4px 10px rgba(139,0,0,.5),inset 0 4px 10px rgba(255,255,255,.4)}50%{box-shadow:0 0 0 16px rgba(255,215,64,0),0 8px 30px rgba(0,0,0,.6),inset 0 -4px 10px rgba(139,0,0,.5),inset 0 4px 10px rgba(255,255,255,.4)}}
@keyframes tileWin{0%,100%{transform:scale(1);box-shadow:0 0 0 2px var(--gold),0 0 16px var(--gold-glow),inset 0 2px 0 rgba(255,255,255,.9)}50%{transform:scale(1.08);box-shadow:0 0 0 2px #fff,0 0 32px var(--gold-glow),inset 0 2px 0 rgba(255,255,255,.9)}}
@keyframes rotate360{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes leafFall{0%{transform:translateY(-40px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(540deg);opacity:0}}
@keyframes winPop{0%{transform:translate(-50%,-50%) scale(0) rotate(-30deg);opacity:0}60%{transform:translate(-50%,-50%) scale(1.15) rotate(8deg);opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}}
@keyframes scaleInBounce{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}60%{transform:translate(-50%,-50%) scale(1.05);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* ===== SPLASH ===== */
.splash{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 30%,rgba(255,193,7,.18) 0%,transparent 55%),radial-gradient(circle at 50% 80%,rgba(255,43,43,.14) 0%,transparent 55%),linear-gradient(180deg,#0a0a0a 0%,#1a1a22 50%,#0a0a0a 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .6s var(--ease),visibility .6s;overflow:hidden}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,193,7,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,193,7,.05) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(ellipse at center,black 25%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at center,black 25%,transparent 70%)}
.splash-scan{position:absolute;left:0;right:0;height:90px;background:linear-gradient(180deg,transparent,rgba(255,193,7,.12),transparent);animation:scan 3s linear infinite}
.splash-rings{position:absolute;inset:0;pointer-events:none}
.splash-ring{position:absolute;top:50%;left:50%;width:200px;height:200px;border:2px solid rgba(255,193,7,.28);border-radius:50%;transform:translate(-50%,-50%);animation:ringOut 2.4s ease-out infinite}
.splash-ring:nth-child(2){animation-delay:.8s;border-color:rgba(255,43,43,.28)}
.splash-ring:nth-child(3){animation-delay:1.6s;border-color:rgba(0,200,83,.28)}
.splash-logo{font-family:'Poppins',sans-serif;font-size:70px;font-weight:900;letter-spacing:2px;background:linear-gradient(110deg,#ffd54f 0%,#ffc107 25%,#ff9800 50%,#ffc107 75%,#ffd54f 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 20px var(--gold-glow));animation:shimmerX 2.5s linear infinite;position:relative;z-index:3;line-height:1}
.splash-logo span{-webkit-text-fill-color:#fff;background:none;color:#fff;text-shadow:0 0 18px var(--gold-glow)}
.splash-sub{font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:6px;color:var(--gold);text-transform:uppercase;margin-top:14px;position:relative;z-index:3;font-weight:800;text-shadow:0 0 12px var(--gold-glow)}
.splash-badges{display:flex;gap:8px;margin-top:22px;position:relative;z-index:3}
.splash-badge{padding:5px 12px;border-radius:6px;background:linear-gradient(135deg,#ffd54f,#ff9800);color:#0a0a0a;font-size:9px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;box-shadow:0 4px 12px rgba(255,152,0,.4)}
.splash-badge.b2{background:linear-gradient(135deg,#69f0ae,#00c853);color:#0a0a0a}
.splash-badge.b3{background:linear-gradient(135deg,#ff2b2b,#d40000);color:#fff}
.splash-status{margin-top:34px;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.55);text-transform:uppercase;position:relative;z-index:3;min-height:14px;font-weight:700}
.splash-bar{width:280px;height:4px;margin-top:16px;overflow:hidden;background:rgba(255,255,255,.08);border-radius:4px;position:relative;z-index:3}
.splash-bar-inner{height:100%;width:0;background:linear-gradient(90deg,#ffd54f,#ff9800,#ff6f00);background-size:200% auto;animation:splashLoad 2s var(--ease-out) forwards,shimmerX 1.6s linear infinite;border-radius:4px;box-shadow:0 0 14px var(--gold-glow)}
.splash-percent{margin-top:12px;font-family:'Poppins',sans-serif;font-size:14px;letter-spacing:3px;color:var(--gold);font-weight:800;position:relative;z-index:3}

/* ===== GAME LOADER ===== */
.game-loader{position:fixed;inset:0;z-index:99998;background:radial-gradient(circle at 50% 45%,rgba(255,193,7,.12) 0%,transparent 45%),linear-gradient(180deg,#0a0a0a,#1a1a22);display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;visibility:hidden;transition:opacity .4s var(--ease),visibility .4s;overflow:hidden}
.game-loader.active{opacity:1;visibility:visible}
.gl-ring{position:absolute;top:50%;left:50%;width:150px;height:150px;border:2px solid rgba(255,193,7,.28);border-radius:50%;transform:translate(-50%,-50%);animation:ringOut 2.2s ease-out infinite}
.gl-ring:nth-child(2){animation-delay:.6s;border-color:rgba(0,200,83,.28)}
.gl-ring:nth-child(3){animation-delay:1.2s;border-color:rgba(255,43,43,.28)}
.gl-icon{width:96px;height:96px;position:relative;z-index:3;filter:drop-shadow(0 0 24px var(--gold-glow));animation:floatY 2.4s ease-in-out infinite}
.gl-icon svg{width:100%;height:100%;fill:var(--gold)}
.gl-title{font-family:'Poppins',sans-serif;font-size:18px;font-weight:900;letter-spacing:4px;color:var(--gold);margin-top:32px;text-transform:uppercase;z-index:3;text-shadow:0 0 16px var(--gold-glow)}
.gl-sub{font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.55);margin-top:10px;text-transform:uppercase;z-index:3;font-weight:700}
.gl-bar{width:260px;height:4px;margin-top:24px;overflow:hidden;background:rgba(255,255,255,.08);border-radius:4px;position:relative;z-index:3}
.gl-bar-inner{height:100%;width:0;background:linear-gradient(90deg,#ffd54f,#ff9800);transition:width .2s linear;box-shadow:0 0 12px var(--gold-glow);border-radius:4px}
.gl-percent{margin-top:12px;font-family:'Poppins',sans-serif;font-size:13px;letter-spacing:2px;color:var(--gold);font-weight:900;z-index:3}

/* ===== TOAST ===== */
.toast{position:fixed;top:calc(var(--safe-top) + 80px);left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:12px;font-size:13px;font-weight:800;letter-spacing:.5px;z-index:9999;max-width:92%;animation:winPop .35s var(--ease-out);box-shadow:0 16px 44px rgba(0,0,0,.65),0 0 0 2px rgba(255,255,255,.1) inset;backdrop-filter:blur(16px);transition:opacity .3s;text-transform:uppercase}
.toast.win{background:linear-gradient(135deg,#00c853,#00a844);color:#fff;box-shadow:0 16px 44px rgba(0,200,83,.5),0 0 0 2px rgba(255,255,255,.15) inset}
.toast.lose{background:linear-gradient(135deg,#ff2b2b,#d40000);color:#fff;box-shadow:0 16px 44px rgba(255,43,43,.5),0 0 0 2px rgba(255,255,255,.15) inset}
.toast.info{background:linear-gradient(135deg,#2196f3,#1565c0);color:#fff}
.toast.gold{background:linear-gradient(135deg,#ffd54f,#ff9800);color:#0a0a0a;box-shadow:0 16px 44px rgba(255,152,0,.5)}

/* ===== HEADER ===== */
.main-header{position:sticky;top:0;z-index:100;padding:calc(var(--safe-top) + 12px) 12px 12px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#1a1a22 0%,#0a0a0a 100%);backdrop-filter:blur(20px);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,var(--red),var(--gold),var(--green),var(--blue)) 1;box-shadow:0 4px 20px rgba(0,0,0,.7),0 0 30px rgba(255,193,7,.15)}
.header-left{display:flex;align-items:center;gap:10px}
.header-logo{display:flex;align-items:baseline;gap:1px;font-family:'Poppins',sans-serif;font-size:22px;font-weight:900;letter-spacing:.5px}
.header-logo-text{background:linear-gradient(110deg,#ffd54f 0%,#ffc107 25%,#ff9800 50%,#ffc107 75%,#ffd54f 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmerX 3s linear infinite;filter:drop-shadow(0 0 8px var(--gold-glow))}
.header-logo-num{color:#fff;-webkit-text-fill-color:#fff;text-shadow:0 0 8px rgba(255,255,255,.5)}
.header-badge{font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:linear-gradient(135deg,#ff2b2b,#d40000);color:#fff;padding:3px 7px;border-radius:5px;margin-left:6px;box-shadow:0 0 10px var(--red-glow);animation:blink 2s infinite}
.header-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:38px;height:38px;background:linear-gradient(135deg,#22222c,#181820);border:1.5px solid rgba(255,193,7,.32);border-radius:10px;display:flex;justify-content:center;align-items:center;transition:all .2s var(--ease);position:relative;padding:0;color:var(--gold)}
.icon-btn:hover{border-color:var(--gold);box-shadow:0 0 14px var(--gold-glow)}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:17px;height:17px;fill:currentColor}
.icon-btn .badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;background:linear-gradient(135deg,#ff2b2b,#d40000);border-radius:9px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #0a0a0a;color:#fff;line-height:1;box-shadow:0 0 10px var(--red-glow);animation:blink 1.5s infinite}
.icon-btn.music-on{background:linear-gradient(135deg,rgba(0,200,83,.2),rgba(0,200,83,.05));border-color:var(--green);color:var(--green);box-shadow:0 0 14px var(--green-glow)}
.header-vip{font-family:'Poppins',sans-serif;font-size:9px;font-weight:900;letter-spacing:1.2px;padding:4px 9px;border-radius:6px;text-transform:uppercase;background:linear-gradient(135deg,#ffd54f,#ff9800);color:#0a0a0a;box-shadow:0 0 12px var(--gold-glow)}

/* ===== RUNNING TEXT ===== */
.running-text{background:linear-gradient(90deg,#ff2b2b,#ff6f00,#ffc107,#00c853,#2196f3,#9c27b0,#ff2b2b);background-size:200% 100%;animation:shimmerX 8s linear infinite;padding:8px 0;overflow:hidden;white-space:nowrap;position:relative;border-bottom:1px solid rgba(0,0,0,.5)}
.running-text-inner{display:inline-block;animation:marquee 32s linear infinite;padding-left:100%;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:900;color:#fff;letter-spacing:1.2px;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.running-text-inner span{display:inline-block;padding:0 40px}

/* ===== TICKER ===== */
.ticker{background:linear-gradient(180deg,#0a0a0a,#101014);border-bottom:1px solid var(--line-2);padding:7px 0;overflow:hidden;white-space:nowrap;position:relative}
.ticker-inner{display:inline-block;animation:marquee 40s linear infinite;padding-left:100%}
.ticker-item{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:0 28px;font-weight:700;color:var(--txt)}
.ticker-item b{color:var(--gold);font-weight:900}
.ticker-item .amount{color:var(--green);font-weight:900;text-shadow:0 0 8px var(--green-glow)}
.ticker-item .dot{width:6px;height:6px;background:var(--green);border-radius:50%;box-shadow:0 0 8px var(--green-glow);animation:blink 1.5s infinite}
.ticker-item .time{color:var(--txt-mute);font-size:10px;font-weight:600}

/* ===== PAGE ===== */
.page{display:none;max-width:820px;margin:0 auto;padding:12px;animation:pageIn .35s var(--ease-out)}
.page.active{display:block}
.section-title{font-family:'Poppins',sans-serif;font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between;text-shadow:0 0 10px var(--gold-glow)}
.section-title > div{display:flex;align-items:center;gap:8px}
.section-title svg{width:15px;height:15px;fill:var(--gold)}
.section-title .action-link{font-size:10px;color:var(--cyan);cursor:pointer;text-transform:uppercase;font-weight:800;letter-spacing:.8px;text-shadow:0 0 8px rgba(0,188,212,.5)}

/* ===== ANNOUNCE ===== */
.announce{background:linear-gradient(135deg,#0a0a0a 0%,#181820 100%);border:2px solid var(--gold);border-radius:14px;padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;box-shadow:0 0 24px rgba(255,193,7,.28),inset 0 0 24px rgba(255,193,7,.05);position:relative;overflow:hidden}
.announce::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,193,7,.18),transparent);animation:shimmerX 3s linear infinite}
.announce-icon{width:36px;height:36px;flex-shrink:0;border-radius:50%;background:linear-gradient(135deg,#ffd54f,#ff9800);display:flex;align-items:center;justify-content:center;color:#0a0a0a;box-shadow:0 0 16px var(--gold-glow);animation:pulseGlow 2s infinite;position:relative}
.announce-icon svg{width:20px;height:20px;fill:#0a0a0a}
.announce-text{flex:1;position:relative}
.announce-text h4{font-size:12px;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;text-shadow:0 0 8px var(--gold-glow)}
.announce-text p{font-size:10px;color:var(--txt-dim);font-weight:600}
.announce-text p b{color:var(--green);font-weight:900}

/* ===== JACKPOT ===== */
.jackpot-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#1a0000 0%,#3d0000 50%,#1a0000 100%);border:2px solid var(--gold);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 0 30px rgba(255,193,7,.4),inset 0 0 30px rgba(255,43,43,.15);text-align:center}
.jackpot-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(255,43,43,.25),transparent 40%),radial-gradient(circle at 80% 50%,rgba(255,152,0,.25),transparent 40%);animation:pulseGlow 3s infinite;pointer-events:none}
.jackpot-label{display:block;font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:900;color:var(--gold);margin-bottom:6px;position:relative;text-shadow:0 0 10px var(--gold-glow)}
.jackpot-value{font-family:'Poppins',sans-serif;font-size:32px;font-weight:900;letter-spacing:1px;position:relative;background:linear-gradient(110deg,#ffd54f 0%,#ffc107 25%,#ff2b2b 50%,#ffc107 75%,#ffd54f 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmerX 3s linear infinite,jackpotCount 2s infinite;filter:drop-shadow(0 0 20px rgba(255,193,7,.7));line-height:1.1}
.jackpot-meta{font-size:9px;color:var(--txt-dim);margin-top:6px;position:relative;letter-spacing:1.5px;font-weight:700}
.jackpot-meta b{color:var(--green);text-shadow:0 0 8px var(--green-glow)}

/* ===== WALLET BAR ===== */
.wallet-bar{position:relative;overflow:hidden;background:linear-gradient(135deg,#1a1a22 0%,#0a0a0a 100%);border:1.5px solid var(--gold);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 0 20px rgba(255,193,7,.28),inset 0 0 20px rgba(255,193,7,.04)}
.wallet-item{display:flex;flex-direction:column;gap:3px;flex:1;position:relative;z-index:1}
.wallet-item .label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--txt-dim);font-weight:800}
.wallet-item .value{font-family:'Poppins',sans-serif;font-size:17px;font-weight:900;display:flex;align-items:center;gap:5px;letter-spacing:.3px}
.wallet-item.game .value{color:var(--gold);text-shadow:0 0 12px var(--gold-glow)}
.wallet-item.wallet .value{color:var(--green);text-shadow:0 0 12px var(--green-glow)}
.wallet-item .value svg{width:14px;height:14px;fill:currentColor}
.wallet-divider{width:2px;height:44px;margin:0 12px;background:linear-gradient(180deg,transparent,var(--gold),transparent);box-shadow:0 0 8px var(--gold-glow)}
.wallet-actions{display:flex;flex-direction:column;gap:5px;position:relative;z-index:1}
.wallet-btn{padding:8px 12px;border-radius:8px;font-size:10px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;border:none;display:flex;align-items:center;gap:5px;transition:all .2s var(--ease);white-space:nowrap}
.wallet-btn svg{width:11px;height:11px;fill:currentColor}
.wallet-btn.topup{background:var(--grad-green);color:#fff;box-shadow:0 4px 14px rgba(0,200,83,.4)}
.wallet-btn.withdraw{background:var(--grad-gold);color:#0a0a0a;box-shadow:0 4px 14px rgba(255,152,0,.4)}
.wallet-btn:active{transform:scale(.95)}

/* ===== PROMO ===== */
.promo-stack{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.promo-banner{position:relative;overflow:hidden;border-radius:14px;padding:14px 12px;text-align:center;cursor:pointer;transition:all .22s var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.promo-banner:active{transform:scale(.97)}
.promo-banner::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);background-size:200% 100%;animation:scrollLight 3.5s linear infinite;pointer-events:none}
.promo-banner.b1{background:linear-gradient(135deg,#ff2b2b,#d40000)}
.promo-banner.b2{background:linear-gradient(135deg,#00c853,#00a844)}
.promo-banner.b3{background:linear-gradient(135deg,#ff9800,#ff6f00)}
.promo-banner.b4{background:linear-gradient(135deg,#9c27b0,#6a1b9a)}
.promo-banner.b5{background:linear-gradient(135deg,#2196f3,#1565c0)}
.promo-banner.b6{background:linear-gradient(135deg,#e91e63,#ad1457)}
.promo-banner h4{font-family:'Poppins',sans-serif;font-size:13px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;color:#fff;margin-bottom:4px;position:relative;z-index:1;text-shadow:0 2px 4px rgba(0,0,0,.4);line-height:1.15}
.promo-banner p{font-size:9px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.9);position:relative;z-index:1}

/* ===== PROVIDER ===== */
.provider-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.provider-card{background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:1.5px solid rgba(255,193,7,.22);border-radius:10px;padding:11px 4px;text-align:center;transition:all .22s var(--ease);position:relative;overflow:hidden}
.provider-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.6}
.provider-card:active{transform:scale(.95);border-color:var(--gold)}
.provider-card .name{font-family:'Poppins',sans-serif;font-size:11px;font-weight:900;letter-spacing:.3px;color:var(--gold);text-shadow:0 0 8px var(--gold-glow)}
.provider-card .sub{font-size:8px;color:var(--txt-dim);margin-top:3px;font-weight:700;letter-spacing:.5px}
.provider-card.hot{border-color:rgba(255,43,43,.5)}
.provider-card.hot .name{color:#ff6b6b;text-shadow:0 0 8px var(--red-glow)}
.provider-card.new{border-color:rgba(0,200,83,.5)}
.provider-card.new .name{color:var(--green);text-shadow:0 0 8px var(--green-glow)}

/* ===== GAME CARDS ===== */
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.game-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#1a1a22 0%,#0a0a0a 100%);border:2px solid rgba(255,193,7,.35);border-radius:16px;padding:16px 12px 14px;text-align:center;transition:all .25s var(--ease);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 20px rgba(255,193,7,.04);cursor:pointer}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold),var(--green),var(--blue));background-size:200% 100%;animation:shimmerX 3s linear infinite}
.game-card:active{transform:scale(.96);border-color:var(--gold)}
.game-card.zeus-card{border-color:rgba(255,193,7,.5);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 20px rgba(255,193,7,.08),0 0 20px rgba(255,193,7,.15)}
.game-card.cowboy-card{border-color:rgba(255,152,0,.5);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 20px rgba(255,152,0,.08),0 0 20px rgba(255,152,0,.15)}
.game-card.ocean-card{border-color:rgba(33,150,243,.5);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 20px rgba(33,150,243,.08),0 0 20px rgba(33,150,243,.15)}
.game-card.space-card{border-color:rgba(156,39,176,.5);box-shadow:0 8px 24px rgba(0,0,0,.5),inset 0 0 20px rgba(156,39,176,.08),0 0 20px rgba(156,39,176,.15)}
.game-card .badge-hot{position:absolute;top:8px;right:8px;font-size:8px;font-weight:900;letter-spacing:1px;padding:3px 8px;border-radius:5px;text-transform:uppercase;background:linear-gradient(135deg,#ff2b2b,#d40000);color:#fff;box-shadow:0 0 10px var(--red-glow);animation:blink 1.6s infinite}
.game-card .badge-hot.new{background:linear-gradient(135deg,#00c853,#00a844);color:#fff;box-shadow:0 0 10px var(--green-glow)}
.g-icon{width:70px;height:70px;margin:0 auto 12px;border-radius:18px;display:flex;justify-content:center;align-items:center;transition:all .3s var(--ease);position:relative}
.g-icon svg{width:38px;height:38px}
.game-card.space-card .g-icon{background:linear-gradient(135deg,rgba(156,39,176,.3),rgba(156,39,176,.08));border:2px solid rgba(156,39,176,.6);box-shadow:inset 0 0 20px rgba(156,39,176,.2)}
.game-card.space-card .g-icon svg{fill:#ce93d8;filter:drop-shadow(0 0 8px rgba(156,39,176,.7))}
.game-card.zeus-card .g-icon{background:linear-gradient(135deg,rgba(255,193,7,.3),rgba(255,193,7,.08));border:2px solid rgba(255,193,7,.6);box-shadow:inset 0 0 20px rgba(255,193,7,.2)}
.game-card.zeus-card .g-icon svg{fill:var(--gold);filter:drop-shadow(0 0 8px var(--gold-glow))}
.game-card.cowboy-card .g-icon{background:linear-gradient(135deg,rgba(255,152,0,.3),rgba(255,152,0,.08));border:2px solid rgba(255,152,0,.6);box-shadow:inset 0 0 20px rgba(255,152,0,.2)}
.game-card.cowboy-card .g-icon svg{fill:#ffb74d;filter:drop-shadow(0 0 8px rgba(255,152,0,.7))}
.game-card.ocean-card .g-icon{background:linear-gradient(135deg,rgba(33,150,243,.3),rgba(33,150,243,.08));border:2px solid rgba(33,150,243,.6);box-shadow:inset 0 0 20px rgba(33,150,243,.2)}
.game-card.ocean-card .g-icon svg{fill:#64b5f6;filter:drop-shadow(0 0 8px rgba(33,150,243,.7))}
.g-name{font-family:'Poppins',sans-serif;font-size:13px;font-weight:900;letter-spacing:.3px;margin-bottom:4px;color:#fff;text-transform:uppercase}
.g-rtp{font-size:9px;color:var(--green);font-weight:800;letter-spacing:.8px;margin-bottom:10px;text-shadow:0 0 8px var(--green-glow)}
.g-btn{display:inline-block;font-size:10px;font-weight:900;letter-spacing:1.4px;padding:8px 22px;border-radius:9px;text-transform:uppercase;background:var(--grad-gold);color:#0a0a0a;box-shadow:0 4px 16px rgba(255,152,0,.5);animation:btnPulse 2s infinite}

/* ===== LEADERBOARD ===== */
.leader-item{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:1.5px solid rgba(255,193,7,.18);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:all .2s var(--ease)}
.leader-item.rank-1{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,193,7,.15),rgba(255,193,7,.04));box-shadow:0 0 20px rgba(255,193,7,.3)}
.leader-item.rank-2{border-color:rgba(192,192,192,.5)}
.leader-item.rank-3{border-color:rgba(205,127,50,.5)}
.leader-rank{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:#22222c;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-size:14px;font-weight:900;color:#fff;border:2px solid rgba(255,255,255,.15)}
.leader-rank.gold{background:var(--grad-gold);color:#0a0a0a;border-color:#fff;box-shadow:0 0 12px var(--gold-glow)}
.leader-rank.silver{background:linear-gradient(135deg,#e0e0e0,#909090);color:#0a0a0a;border-color:#fff}
.leader-rank.bronze{background:linear-gradient(135deg,#e09555,#8b4513);color:#fff;border-color:#fff}
.leader-name{flex:1;font-size:12px;font-weight:800;color:#fff}
.leader-name .you{font-size:9px;background:var(--grad-red);color:#fff;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.leader-score{font-family:'Poppins',sans-serif;font-size:13px;font-weight:900;color:var(--gold);text-shadow:0 0 10px var(--gold-glow)}

/* ===== HISTORY ===== */
.history-item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border-left:3px solid var(--gold);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.history-item .info{font-size:11px;flex:1;min-width:0}
.history-item .info .game-name{display:flex;align-items:center;gap:6px;font-weight:800;margin-bottom:4px;color:#fff}
.history-item .info .game-name svg{width:13px;height:13px;fill:var(--gold)}
.history-item .info .time{color:var(--txt-mute);font-size:10px;font-weight:600}
.history-item .amount{font-family:'Poppins',sans-serif;font-size:14px;font-weight:900}
.amount.win{color:var(--green);text-shadow:0 0 10px var(--green-glow)}
.amount.lose{color:var(--red);text-shadow:0 0 10px var(--red-glow)}
.amount.jackpot{color:var(--gold);text-shadow:0 0 10px var(--gold-glow)}
.filter-tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:4px}
.filter-tabs::-webkit-scrollbar{display:none}
.filter-tab{background:#1a1a22;border:1.5px solid rgba(255,193,7,.22);padding:8px 16px;border-radius:20px;font-size:10px;font-weight:900;letter-spacing:.6px;color:#fff;white-space:nowrap;transition:all .2s var(--ease);text-transform:uppercase}
.filter-tab.active{background:var(--grad-gold);color:#0a0a0a;border-color:transparent;box-shadow:0 4px 14px rgba(255,152,0,.5)}

/* ===== BOTTOM NAV ===== */
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:200;background:linear-gradient(180deg,#1a1a22 0%,#0a0a0a 100%);border-top:2px solid transparent;border-image:linear-gradient(90deg,var(--red),var(--gold),var(--green),var(--blue)) 1;display:flex;justify-content:space-around;align-items:center;padding:6px 0 calc(var(--safe-bottom) + 6px);backdrop-filter:blur(24px);box-shadow:0 -8px 32px rgba(0,0,0,.7),0 -4px 20px rgba(255,193,7,.15)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;font-weight:800;letter-spacing:.4px;color:var(--txt-dim);background:none;border:none;padding:6px 10px;border-radius:10px;transition:all .2s var(--ease);flex:1;max-width:76px;position:relative;text-transform:uppercase}
.nav-item:active{transform:scale(.92)}
.nav-item.active{color:var(--gold);text-shadow:0 0 10px var(--gold-glow)}
.nav-item.active::after{content:'';position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:3px;background:var(--grad-gold);box-shadow:0 0 12px var(--gold-glow)}
.nav-item svg{width:20px;height:20px;fill:currentColor;filter:drop-shadow(0 0 4px currentColor)}

/* ===== FORMS ===== */
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:800;margin-bottom:7px;text-shadow:0 0 6px var(--gold-glow)}
.form-group input{width:100%;padding:14px 16px;background:#0a0a0a;border:1.5px solid rgba(255,193,7,.28);border-radius:11px;color:#fff;font-size:14px;font-weight:700;outline:none;transition:all .22s var(--ease)}
.form-group input::placeholder{color:var(--txt-mute);font-weight:600}
.form-group input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,193,7,.15),0 0 20px var(--gold-glow)}
.btn{width:100%;padding:15px;border:none;border-radius:12px;color:#fff;font-size:13px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px;transition:all .22s var(--ease);background:var(--grad-green);box-shadow:0 8px 22px rgba(0,200,83,.4),inset 0 1px 0 rgba(255,255,255,.2);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed;animation:none}
.btn svg{width:17px;height:17px;fill:currentColor}
.btn-secondary{background:linear-gradient(135deg,#22222c,#181820);color:#fff;border:1.5px solid rgba(255,193,7,.32);box-shadow:none}
.btn-gold{background:var(--grad-gold);color:#0a0a0a;box-shadow:0 8px 22px rgba(255,152,0,.5),inset 0 1px 0 rgba(255,255,255,.4)}
.btn-red{background:var(--grad-red);color:#fff;box-shadow:0 8px 22px rgba(255,43,43,.5)}

/* ===== OVERLAYS ===== */
.overlay{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.94);backdrop-filter:blur(20px);display:flex;justify-content:center;align-items:center;padding:20px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.overlay.active{opacity:1;pointer-events:auto}
.login-card{width:100%;max-width:390px;margin:auto;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:2px solid var(--gold);border-radius:22px;padding:30px 24px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 40px rgba(255,193,7,.3),inset 0 0 30px rgba(255,193,7,.04);animation:bounceIn .5s var(--ease-bounce);position:relative;overflow:hidden}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold),var(--green));background-size:200% 100%;animation:shimmerX 3s linear infinite}
.login-logo{width:80px;height:80px;margin:0 auto 16px;border-radius:20px;background:var(--grad-gold);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-size:40px;font-weight:900;color:#0a0a0a;box-shadow:0 12px 32px rgba(255,152,0,.5),0 0 40px rgba(255,193,7,.4),inset 0 2px 0 rgba(255,255,255,.4)}
.login-title{font-family:'Poppins',sans-serif;font-size:26px;font-weight:900;text-align:center;letter-spacing:1px;margin-bottom:4px;background:linear-gradient(110deg,#ffd54f 0%,#ffc107 25%,#ff9800 50%,#ffc107 75%,#ffd54f 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmerX 3s linear infinite;filter:drop-shadow(0 0 10px var(--gold-glow))}
.login-subtitle{text-align:center;font-size:10px;letter-spacing:3px;color:var(--txt-dim);text-transform:uppercase;margin-bottom:20px;font-weight:800}
.tab-switch{display:flex;gap:5px;margin-bottom:20px;background:#0a0a0a;border:1.5px solid rgba(255,193,7,.22);border-radius:10px;padding:4px}
.tab-switch button{flex:1;padding:11px;background:transparent;border:none;color:var(--txt-dim);font-size:11px;font-weight:800;letter-spacing:.6px;border-radius:8px;transition:all .22s var(--ease);text-transform:uppercase}
.tab-switch button.active{background:var(--grad-gold);color:#0a0a0a;box-shadow:0 4px 14px rgba(255,152,0,.5)}
.welcome-popup{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);backdrop-filter:blur(20px);display:flex;justify-content:center;align-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.welcome-popup.active{opacity:1;pointer-events:auto}
.welcome-card{max-width:380px;width:100%;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:2px solid var(--gold);border-radius:22px;padding:30px 24px;text-align:center;animation:bounceIn .6s var(--ease-bounce);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 50px rgba(255,193,7,.4)}
.welcome-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--gold),var(--green),var(--blue),var(--red));background-size:200% 100%;animation:shimmerX 2.5s linear infinite}
.welcome-card .gift-icon{width:90px;height:90px;margin:0 auto 16px;border-radius:50%;background:var(--grad-gold);display:flex;align-items:center;justify-content:center;font-size:50px;color:#0a0a0a;box-shadow:0 12px 40px rgba(255,152,0,.6),inset 0 -2px 4px rgba(0,0,0,.2);animation:pulseGlow 2s infinite}
.welcome-card h2{font-family:'Poppins',sans-serif;font-size:22px;font-weight:900;letter-spacing:1px;margin-bottom:8px;color:var(--gold);text-shadow:0 0 20px var(--gold-glow);text-transform:uppercase}
.welcome-card p{font-size:12px;color:var(--txt-dim);line-height:1.6;margin-bottom:16px;font-weight:600}
.welcome-card .bonus{font-family:'Poppins',sans-serif;font-size:28px;font-weight:900;letter-spacing:1px;background:var(--grad-red);color:#fff;padding:16px;border-radius:12px;margin-bottom:18px;box-shadow:0 12px 32px rgba(255,43,43,.5),inset 0 2px 0 rgba(255,255,255,.2);text-shadow:0 2px 4px rgba(0,0,0,.3);animation:jackpotCount 1.5s infinite}
.chat-float{position:fixed;bottom:calc(var(--safe-bottom) + 90px);right:14px;width:56px;height:56px;z-index:150;border-radius:50%;border:3px solid #fff;background:var(--grad-green);color:#fff;display:flex;justify-content:center;align-items:center;box-shadow:0 8px 32px rgba(0,200,83,.6),0 0 0 8px rgba(0,200,83,.2);transition:all .22s var(--ease);animation:btnPulse 2s infinite}
.chat-float:active{transform:scale(.9)}
.chat-float svg{width:26px;height:26px;fill:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.chat-float .badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;background:var(--grad-red);border-radius:10px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff;color:#fff;animation:blink 1.2s infinite}
.modal-overlay{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.9);backdrop-filter:blur(16px);display:flex;justify-content:center;align-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-box{max-width:360px;width:100%;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:2px solid var(--gold);border-radius:18px;padding:26px 22px;text-align:center;animation:bounceIn .4s var(--ease-bounce);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 40px rgba(255,193,7,.3)}
.modal-box h3{font-family:'Poppins',sans-serif;font-size:16px;font-weight:900;letter-spacing:.8px;color:var(--gold);margin-bottom:14px;text-shadow:0 0 12px var(--gold-glow);text-transform:uppercase}
.modal-box p{font-size:12px;color:var(--txt-dim);line-height:1.65;margin-bottom:20px;font-weight:600}
.modal-btn{background:var(--grad-gold);color:#0a0a0a;border:none;padding:12px 32px;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;box-shadow:0 8px 22px rgba(255,152,0,.5)}

/* ===== WALLET PAGES ===== */
.wallet-tier-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#2a1a4a,#0a0a0a);border:2px solid var(--purple);border-radius:16px;padding:16px 18px;margin-bottom:12px;box-shadow:0 0 24px rgba(156,39,176,.4)}
.wallet-tier-card::before{content:'';position:absolute;top:0;right:-100%;width:100%;height:100%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.15) 50%,transparent 70%);animation:shimmerX 4s linear infinite}
.wallet-tier-card .tier-name{font-family:'Poppins',sans-serif;font-size:18px;font-weight:900;letter-spacing:1px;color:#fff;margin-bottom:4px;position:relative;text-shadow:0 0 12px rgba(156,39,176,.6)}
.wallet-tier-card .tier-desc{font-size:10px;color:rgba(255,255,255,.82);margin-bottom:12px;position:relative;font-weight:600}
.wallet-tier-progress{height:8px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden;position:relative}
.wallet-tier-progress-inner{height:100%;border-radius:4px;background:var(--grad-gold);box-shadow:0 0 12px var(--gold-glow);transition:width .6s var(--ease)}
.wallet-history-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border-left:2px solid var(--green);border-radius:10px;padding:12px 16px;margin-bottom:8px}
.wallet-history-item.withdraw{border-left-color:var(--red)}
.wallet-history-item.convert{border-left-color:var(--purple)}
.wallet-history-item.bonus{border-left-color:var(--gold)}
.wallet-history-item.topup{border-left-color:var(--blue)}
.wallet-history-item .info{display:flex;align-items:center;gap:10px;flex:1;font-size:11px}
.wallet-history-item .info b{font-weight:800;color:#fff;display:block}
.wallet-history-item .info small{color:var(--txt-mute);font-size:9px;margin-top:2px;font-weight:700;display:block}
.wallet-history-item .amount{font-family:'Poppins',sans-serif;font-size:12px;font-weight:900}
.wallet-history-item .amount.positive{color:var(--green)}
.wallet-history-item .amount.negative{color:var(--red)}

/* ===== PAYMENT ===== */
.payment-page{background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:1.5px solid rgba(255,193,7,.25);border-radius:16px;padding:18px;margin-bottom:12px}
.payment-page h3{display:flex;align-items:center;gap:8px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:900;letter-spacing:1px;color:var(--gold);margin-bottom:8px;text-shadow:0 0 10px var(--gold-glow);text-transform:uppercase}
.payment-page h3 svg{width:16px;height:16px;fill:var(--gold)}
.payment-page p{font-size:11px;color:var(--txt-dim);margin-bottom:16px;line-height:1.6;font-weight:600}
.payment-page p b{color:var(--green);font-weight:900}
.payment-amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.payment-amount{background:#0a0a0a;border:1.5px solid rgba(255,193,7,.25);border-radius:11px;padding:13px 6px;text-align:center;transition:all .22s var(--ease);position:relative;cursor:pointer}
.payment-amount:active{transform:scale(.94)}
.payment-amount.selected{background:linear-gradient(135deg,rgba(255,193,7,.15),rgba(255,193,7,.05));border-color:var(--gold);box-shadow:0 0 20px var(--gold-glow),inset 0 0 12px rgba(255,193,7,.1)}
.payment-amount b{display:block;font-family:'Poppins',sans-serif;font-size:13px;font-weight:900;color:var(--gold);margin-bottom:3px}
.payment-amount span{font-size:8px;letter-spacing:1.2px;color:var(--txt-dim);text-transform:uppercase;font-weight:800}
.payment-amount .bonus{position:absolute;top:-8px;right:-8px;background:var(--grad-red);color:#fff;font-size:8px;font-weight:900;padding:3px 7px;border-radius:6px;letter-spacing:.5px;box-shadow:0 0 10px var(--red-glow);animation:blink 1.5s infinite}
.payment-summary{background:linear-gradient(135deg,rgba(0,200,83,.08),rgba(255,193,7,.04));border:2px dashed rgba(0,200,83,.4);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.payment-summary .row{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;color:#fff;font-weight:700}
.payment-summary .row.total{border-top:1px solid var(--line-2);margin-top:8px;padding-top:10px;font-size:13px;font-weight:900}
.payment-summary .row.total b{font-family:'Poppins',sans-serif;font-size:16px;color:var(--green);text-shadow:0 0 10px var(--green-glow)}
.method-list{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.method-card{display:flex;align-items:center;gap:12px;background:#0a0a0a;border:1.5px solid rgba(255,193,7,.2);border-radius:12px;padding:13px 14px;transition:all .22s var(--ease);cursor:pointer;position:relative;overflow:hidden}
.method-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad-gold);opacity:0;transition:opacity .22s}
.method-card.selected{border-color:var(--gold);background:linear-gradient(135deg,rgba(255,193,7,.12),rgba(255,193,7,.02));box-shadow:0 0 20px rgba(255,193,7,.3),inset 0 0 12px rgba(255,193,7,.05)}
.method-card.selected::before{opacity:1}
.method-logo{width:44px;height:44px;flex-shrink:0;border-radius:11px;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-size:11px;font-weight:900;color:var(--gold);letter-spacing:.4px;text-shadow:0 0 8px var(--gold-glow)}
.method-body{flex:1;min-width:0}
.method-body h4{font-size:12px;font-weight:900;color:#fff;margin-bottom:3px;letter-spacing:.3px;text-transform:uppercase}
.method-body p{font-size:10px;color:var(--txt-dim);line-height:1.4;letter-spacing:.1px;font-weight:700}
.method-body p b{color:var(--gold);font-weight:900}
.method-check{width:22px;height:22px;flex-shrink:0;border-radius:50%;border:2px solid rgba(255,193,7,.3);display:flex;align-items:center;justify-content:center;transition:all .22s}
.method-check svg{width:12px;height:12px;fill:transparent;transition:fill .2s}
.method-card.selected .method-check{background:var(--grad-gold);border-color:transparent;box-shadow:0 0 10px var(--gold-glow)}
.method-card.selected .method-check svg{fill:#0a0a0a}
.amount-custom{display:flex;align-items:center;gap:10px;background:#0a0a0a;border:1.5px solid rgba(255,193,7,.28);border-radius:11px;padding:12px 15px;margin-bottom:14px}
.amount-custom:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,193,7,.15),0 0 18px var(--gold-glow)}
.amount-custom .prefix{font-family:'Poppins',sans-serif;font-size:15px;font-weight:900;color:var(--gold);flex-shrink:0;text-shadow:0 0 8px var(--gold-glow)}
.amount-custom input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:15px;font-weight:900;letter-spacing:.3px;min-width:0}
.amount-custom input::placeholder{color:var(--txt-mute);font-weight:700}
.amount-custom .suffix{font-size:10px;color:var(--txt-dim);letter-spacing:1.2px;text-transform:uppercase;font-weight:900;flex-shrink:0}
.range-wrap{position:relative;padding:6px 0 22px;margin-bottom:12px}
.range-input{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;outline:none;background:linear-gradient(90deg,var(--gold) 0%,var(--gold) var(--p,50%),rgba(255,193,7,.15) var(--p,50%),rgba(255,193,7,.15) 100%);transition:background .1s}
.range-input::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:var(--grad-gold);border:3px solid #fff;box-shadow:0 4px 14px var(--gold-glow),0 0 0 4px rgba(255,193,7,.15);cursor:pointer}
.range-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--txt-mute);letter-spacing:1.2px;text-transform:uppercase;font-weight:900;position:absolute;bottom:0;left:0;right:0}
.live-preview{background:rgba(0,0,0,.35);border:1.5px solid rgba(255,193,7,.22);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.lp-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:#fff;font-weight:700}
.lp-row.dim{color:var(--txt-dim);font-size:11px;font-weight:700}
.lp-row b{font-family:'Poppins',sans-serif;font-weight:900;color:var(--gold);text-shadow:0 0 8px var(--gold-glow)}
.lp-row b.up{color:var(--green);text-shadow:0 0 8px var(--green-glow)}
.lp-row b.down{color:var(--red);text-shadow:0 0 8px var(--red-glow)}
.lp-row.divider{border-top:1px dashed rgba(255,255,255,.15);margin-top:6px;padding-top:10px;font-size:14px;font-weight:900}
.lp-row.divider b{font-size:16px}
.swap-icon{width:40px;height:40px;border-radius:50%;background:var(--grad-gold);border:2px solid #fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 18px var(--gold-glow)}
.swap-icon svg{width:20px;height:20px;fill:#0a0a0a}
.steps{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:16px}
.step-dot{width:28px;height:28px;border-radius:50%;background:#22222c;border:1.5px solid rgba(255,193,7,.28);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-size:12px;font-weight:900;color:var(--txt-mute);transition:all .3s var(--ease)}
.step-dot.active{background:var(--grad-gold);color:#0a0a0a;border-color:transparent;box-shadow:0 0 16px var(--gold-glow)}
.step-dot.done{background:var(--grad-green);color:#fff;border-color:transparent;box-shadow:0 0 12px var(--green-glow)}
.step-line{width:24px;height:3px;background:rgba(255,193,7,.15);border-radius:3px}
.step-line.done{background:var(--grad-gold);box-shadow:0 0 8px var(--gold-glow)}

/* ===== HERO / PROFILE ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2a1a4a 0%,#1a0a0a 50%,#0a0a0a 100%);border:2px solid var(--gold);border-radius:22px;padding:26px 20px;text-align:center;margin-bottom:14px;box-shadow:0 0 40px rgba(255,193,7,.3),inset 0 0 30px rgba(255,43,43,.1)}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(255,193,7,.2),transparent 50%);animation:pulseGlow 3s infinite}
.hero > *{position:relative}
.hero h2{font-family:'Poppins',sans-serif;font-size:24px;font-weight:900;letter-spacing:1px;color:#fff;margin-bottom:6px;text-shadow:0 0 20px var(--gold-glow)}
.hero p{font-size:11px;color:var(--txt-dim);margin-bottom:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.hero .hero-badge{display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border-radius:20px;background:rgba(0,0,0,.4);border:1.5px solid var(--gold)}
.vip-progress{background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:1.5px solid rgba(255,193,7,.22);border-radius:16px;padding:16px;margin-bottom:12px}
.vip-bar{height:10px;border-radius:5px;background:rgba(0,0,0,.5);overflow:hidden;margin:8px 0;border:1px solid rgba(255,193,7,.2)}
.vip-bar-inner{height:100%;border-radius:5px;background:var(--grad-gold);box-shadow:0 0 14px var(--gold-glow);transition:width .6s var(--ease)}

/* ===== SETTINGS / STATS / REFERRAL ===== */
.settings-item{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:1.5px solid rgba(255,193,7,.18);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.settings-item .label{font-size:12px;font-weight:800;color:#fff}
.settings-item .toggle{width:48px;height:27px;border-radius:15px;background:#22222c;position:relative;cursor:pointer;transition:background .3s var(--ease);flex-shrink:0;border:1.5px solid rgba(255,255,255,.1)}
.settings-item .toggle.active{background:var(--grad-green);border-color:var(--green);box-shadow:0 0 14px var(--green-glow)}
.settings-item .toggle::after{content:'';position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .3s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.5)}
.settings-item .toggle.active::after{left:23px}
.stat-card{background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:1.5px solid rgba(255,193,7,.22);border-radius:12px;padding:14px;text-align:center}
.stat-card b{display:block;font-family:'Poppins',sans-serif;font-size:20px;font-weight:900;color:var(--gold);margin-bottom:4px;text-shadow:0 0 12px var(--gold-glow)}
.stat-card span{display:block;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--txt-dim);font-weight:800}
.referral-card{position:relative;overflow:hidden;background:linear-gradient(135deg,#6a1b9a,#2a1a4a);border:2px solid var(--purple);border-radius:22px;padding:24px;text-align:center;margin-bottom:14px;box-shadow:0 0 30px rgba(156,39,176,.4)}
.referral-card::before{content:'';position:absolute;top:0;right:-100%;width:100%;height:100%;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);animation:shimmerX 4s linear infinite}
.referral-code{font-family:'Poppins',sans-serif;font-size:24px;font-weight:900;letter-spacing:4px;color:#fff;margin:16px 0;position:relative;text-shadow:0 0 20px rgba(255,255,255,.6)}
.referral-copy{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.35);border-radius:11px;padding:12px 22px;font-size:11px;font-weight:900;letter-spacing:1.2px;color:#fff;text-transform:uppercase;position:relative}

/* ===== CHART / ADMIN ===== */
.chart-bar{display:flex;align-items:flex-end;gap:10px;height:120px;padding:20px 0}
.chart-col{flex:1;min-height:5px;border-radius:6px 6px 0 0;background:var(--grad-gold);position:relative;box-shadow:0 0 12px var(--gold-glow)}
.chart-col-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--txt-dim);letter-spacing:1px;text-transform:uppercase;white-space:nowrap;font-weight:800}
.chart-col-value{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-family:'Poppins',sans-serif;font-size:10px;color:var(--gold);font-weight:900;white-space:nowrap;text-shadow:0 0 6px var(--gold-glow)}
.admin-panel{background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:1.5px solid rgba(255,193,7,.22);border-radius:16px;padding:16px;margin-bottom:12px}
.admin-panel h2{display:flex;align-items:center;gap:8px;font-family:'Poppins',sans-serif;font-size:13px;font-weight:900;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin-bottom:12px;text-shadow:0 0 10px var(--gold-glow)}
.admin-panel h2 svg{width:15px;height:15px;fill:var(--gold)}
.admin-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.admin-stat{background:#0a0a0a;border:1px solid rgba(255,193,7,.18);border-radius:11px;padding:12px;text-align:center}
.admin-stat b{display:block;font-family:'Poppins',sans-serif;font-size:18px;font-weight:900;color:var(--gold);margin-bottom:3px;text-shadow:0 0 10px var(--gold-glow)}
.admin-stat span{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--txt-dim);font-weight:800}
.data-table{width:100%;border-collapse:collapse;font-size:11px}
.data-table th{background:#0a0a0a;padding:10px;text-align:left;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);font-weight:900;border-bottom:1px solid rgba(255,193,7,.22)}
.data-table td{padding:10px;border-bottom:1px solid var(--line-2);color:#fff;font-weight:600}
.btn-topup,.btn-reset,.btn-delete{border:none;padding:6px 10px;border-radius:7px;font-size:9px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;margin-right:3px}
.btn-topup{background:var(--grad-green);color:#fff}
.btn-reset{background:var(--grad-gold);color:#0a0a0a}
.btn-delete{background:var(--grad-red);color:#fff}

/* ===== FX ===== */
.win-popup{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(0);padding:30px 46px;border-radius:20px;font-family:'Poppins',sans-serif;font-size:26px;font-weight:900;letter-spacing:1px;text-transform:uppercase;background:var(--grad-gold);color:#0a0a0a;z-index:9999;box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 2px 0 rgba(255,255,255,.5),0 0 60px var(--gold-glow);transition:transform .5s var(--ease-out);pointer-events:none;text-align:center}
.win-popup.show{transform:translate(-50%,-50%) scale(1);animation:stampIn .5s var(--ease-bounce)}
.win-popup small{display:block;font-family:'Montserrat',sans-serif;font-size:12px;margin-top:8px;font-weight:900;letter-spacing:.8px}
.win-popup.big{background:linear-gradient(135deg,#ff2b2b 0%,#ff9800 50%,#ffc107 100%);color:#fff;font-size:32px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9997;overflow:hidden}
.confetti-piece{position:absolute;width:10px;height:10px;animation:confettiFall 3s linear forwards}
.coin-rain{position:fixed;inset:0;pointer-events:none;z-index:9996;overflow:hidden}
.coin-rain .coin{position:absolute;top:-40px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffd54f 0%,#ffc107 45%,#ff6f00 100%);box-shadow:0 0 12px var(--gold-glow),inset 0 -2px 3px rgba(124,60,0,.5);animation:coinFall 3s linear forwards;display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-size:13px;font-weight:900;color:#7c3c00}
.coin-burst{position:fixed;inset:0;pointer-events:none;z-index:99997;overflow:hidden}
.coin-burst .coin-p{position:absolute;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffd54f 0%,#ffc107 45%,#ff6f00 100%);box-shadow:0 0 14px var(--gold-glow),inset 0 -2px 3px rgba(124,60,0,.5);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-size:13px;font-weight:900;color:#7c3c00;animation:coinRise 1.5s var(--ease) forwards}
.coin-burst .coin-p.down{background:radial-gradient(circle at 32% 28%,#ffcdd2 0%,#ff5252 45%,#b71c1c 100%);color:#5c1a17;box-shadow:0 0 14px var(--red-glow),inset 0 -2px 3px rgba(92,26,23,.4);animation:coinDropAway 1.5s cubic-bezier(.55,.09,.68,.53) forwards}
.amount-tag{position:fixed;z-index:99996;pointer-events:none;font-family:'Poppins',sans-serif;font-size:24px;font-weight:900;letter-spacing:.5px;padding:10px 22px;border-radius:14px;background:rgba(0,0,0,.88);border:2px solid var(--gold);backdrop-filter:blur(12px);animation:amountFloat 1.6s var(--ease) forwards;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.amount-tag.up{color:var(--green);border-color:var(--green);box-shadow:0 0 28px var(--green-glow)}
.amount-tag.down{color:var(--red);border-color:var(--red);box-shadow:0 0 28px var(--red-glow)}
.receipt-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.94);backdrop-filter:blur(20px);display:flex;justify-content:center;align-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.receipt-overlay.active{opacity:1;pointer-events:auto}
.receipt{width:100%;max-width:380px;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:2px solid var(--gold);border-radius:22px;padding:30px 24px 22px;text-align:center;position:relative;overflow:hidden;animation:receiptIn .5s var(--ease-out);box-shadow:0 30px 90px rgba(0,0,0,.8),0 0 60px var(--gold-glow),inset 0 0 30px rgba(255,193,7,.05)}
.receipt::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--red),var(--gold),var(--green),var(--blue),var(--red));background-size:200% 100%;animation:shimmerX 2.5s linear infinite}
.receipt.down{border-color:var(--red);box-shadow:0 30px 90px rgba(0,0,0,.8),0 0 60px var(--red-glow),inset 0 0 30px rgba(255,43,43,.05)}
.receipt.down::before{background:linear-gradient(90deg,var(--red),#ff6f00,var(--red));background-size:200% 100%}
.receipt-icon{width:88px;height:88px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--grad-gold);box-shadow:0 14px 40px rgba(255,152,0,.5),inset 0 2px 0 rgba(255,255,255,.5);animation:iconPop .6s var(--ease-bounce) both}
.receipt.down .receipt-icon{background:var(--grad-red);box-shadow:0 14px 40px rgba(255,43,43,.5)}
.receipt-icon svg{width:42px;height:42px;fill:#0a0a0a}
.receipt.down .receipt-icon svg{fill:#fff}
.receipt-title{font-family:'Poppins',sans-serif;font-size:18px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;text-shadow:0 0 16px var(--gold-glow)}
.receipt.down .receipt-title{color:var(--red);text-shadow:0 0 16px var(--red-glow)}
.receipt-sub{font-size:11px;color:var(--txt-dim);line-height:1.6;letter-spacing:.4px;margin-bottom:16px;font-weight:700}
.receipt-amount{font-family:'Poppins',sans-serif;font-size:36px;font-weight:900;letter-spacing:.5px;margin-bottom:4px;background:linear-gradient(110deg,#ffd54f,#ffc107 50%,#ff6f00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px var(--gold-glow))}
.receipt.down .receipt-amount{background:linear-gradient(110deg,#ffcdd2,#ff5252 50%,#b71c1c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 20px var(--red-glow))}
.receipt-meta{font-size:10px;color:var(--txt-mute);letter-spacing:1.2px;text-transform:uppercase;font-weight:800;margin-bottom:18px}
.receipt-breakdown{background:rgba(0,0,0,.4);border:1.5px solid rgba(255,193,7,.25);border-radius:12px;padding:12px 14px;margin-bottom:18px;text-align:left}
.receipt.down .receipt-breakdown{border-color:rgba(255,43,43,.35)}
.receipt-breakdown .rb-row{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;color:#fff;font-weight:700}
.receipt-breakdown .rb-row b{font-family:'Poppins',sans-serif;font-weight:900;color:var(--gold);text-shadow:0 0 8px var(--gold-glow)}
.receipt.down .receipt-breakdown .rb-row b{color:var(--red);text-shadow:0 0 8px var(--red-glow)}
.receipt-breakdown .rb-row.divider{border-top:1px dashed rgba(255,255,255,.15);margin-top:6px;padding-top:10px;font-size:13px;font-weight:900}
.receipt-cta{display:flex;gap:9px;margin-top:4px}
.receipt-cta .btn{flex:1;padding:13px;font-size:12px}
.achievement-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:9999;text-align:center;transition:transform .6s var(--ease-bounce);pointer-events:none}
.achievement-popup.show{transform:translate(-50%,-50%) scale(1)}
.ach-icon{width:130px;height:130px;margin:0 auto;border-radius:50%;background:var(--grad-gold);display:flex;align-items:center;justify-content:center;box-shadow:0 20px 60px rgba(255,152,0,.6),inset 0 2px 0 rgba(255,255,255,.5);animation:pulseGlow 1.5s infinite}
.ach-icon svg{width:60px;height:60px;fill:#0a0a0a}
.ach-text{margin-top:16px;font-family:'Poppins',sans-serif;font-size:20px;font-weight:900;letter-spacing:1px;color:var(--gold);text-shadow:0 0 16px var(--gold-glow);text-transform:uppercase}
.ach-desc{font-size:12px;color:#fff;margin-top:6px;font-weight:800;letter-spacing:.6px}
.leaf{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:9995;animation:leafFall 6s linear forwards}
.bolt-effect{position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:0;background:radial-gradient(circle,rgba(255,193,7,.6),transparent 60%)}
.bolt-effect.flash{animation:flash .4s ease-out}
.star-field{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}

/* ============================================================
   SPACE GAME — FULLY FIXED
   ============================================================ */
.space-shell{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(circle at 20% 15%,#2a1a4a 0%,transparent 45%),radial-gradient(circle at 80% 75%,#0a2340 0%,transparent 50%),linear-gradient(180deg,#0a0518 0%,#120a26 40%,#0a0518 100%)}
.space-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
.space-shape{position:absolute;border-radius:50%;pointer-events:none;z-index:2;filter:blur(.3px);animation:floatY 7s ease-in-out infinite}
.space-shape.p1{width:60px;height:60px;top:16%;left:-18px;background:radial-gradient(circle at 30% 30%,#ff6b6b,#6b1010);box-shadow:0 0 60px rgba(255,107,107,.7)}
.space-shape.p2{width:94px;height:94px;top:44%;right:-24px;background:radial-gradient(circle at 30% 30%,#64b5f6,#0f2a5c);box-shadow:0 0 70px rgba(100,181,246,.7);animation-delay:2s}
.space-shape.p3{width:42px;height:42px;bottom:38%;left:8%;background:radial-gradient(circle at 30% 30%,#ffd54f,#5c3a0f);box-shadow:0 0 50px rgba(255,213,79,.7);animation-delay:4s}
.space-top{position:relative;z-index:20;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--safe-top) + 10px) 14px 10px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent)}
.space-top .btn-back{width:42px;height:42px;border-radius:12px;border:2px solid rgba(255,193,7,.6);background:linear-gradient(135deg,#22222c,#0a0a0a);color:var(--gold);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 0 12px rgba(255,193,7,.3)}
.space-top .btn-back:active{transform:scale(.92)}
.space-top .btn-back svg{width:20px;height:20px;fill:currentColor}
.space-top .space-bal{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:20px;background:linear-gradient(135deg,#1a1a22,#0a0a0a);border:2px solid var(--gold);box-shadow:0 0 16px var(--gold-glow)}
.space-top .space-bal svg{width:14px;height:14px;fill:var(--gold)}
.space-top .space-bal span{font-family:'Poppins',sans-serif;font-size:13px;font-weight:900;color:var(--gold);text-shadow:0 0 8px var(--gold-glow)}
.space-top .btn-menu{width:42px;height:42px;border-radius:12px;border:2px solid rgba(255,193,7,.6);background:linear-gradient(135deg,#22222c,#0a0a0a);color:var(--gold);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.space-top .btn-menu svg{width:18px;height:18px;fill:currentColor}
.space-stage-wrap{position:relative;z-index:10;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px}
.space-mult{font-family:'Poppins',sans-serif;font-size:72px;font-weight:900;letter-spacing:1px;background:linear-gradient(160deg,#ff7a9c 0%,#ff2b2b 50%,#d40000 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 rgba(139,0,0,.6)) drop-shadow(0 0 24px var(--red-glow));padding:0;text-align:center;margin:8px 0}
.space-hero-wrap{position:relative;flex:1 1 auto;min-height:120px;display:flex;align-items:center;justify-content:center;width:100%}
.space-hero{width:150px;height:172px;position:relative;animation:floatY 3.4s ease-in-out infinite;filter:drop-shadow(0 18px 40px rgba(0,0,0,.7))}
.space-hero svg{width:100%;height:100%}
.space-balloon{position:absolute;top:-42px;left:50%;transform:translateX(-50%);width:60px;height:82px;animation:floatY 2.2s ease-in-out infinite}
.space-controls{position:relative;z-index:5;background:linear-gradient(180deg,rgba(26,10,40,.98),rgba(10,6,24,.99));border-top:2px solid var(--gold);border-radius:24px 24px 0 0;padding:16px 16px 6px;margin-top:auto;flex-shrink:0;box-shadow:0 -8px 30px rgba(255,193,7,.2)}
.space-row{display:flex;justify-content:space-between;align-items:center;background:rgba(255,193,7,.08);border:1.5px solid rgba(255,193,7,.25);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.space-row .left{display:flex;align-items:center;gap:10px}
.switch{width:46px;height:26px;flex-shrink:0;background:#22222c;border-radius:14px;position:relative;cursor:pointer;transition:background .3s var(--ease);border:1.5px solid rgba(255,255,255,.1)}
.switch.active{background:var(--grad-green);border-color:var(--green);box-shadow:0 0 12px var(--green-glow)}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .3s var(--ease);box-shadow:0 2px 6px rgba(0,0,0,.4)}
.switch.active::after{left:22px}
.space-label{font-size:12px;font-weight:800;color:#fff;text-transform:uppercase;letter-spacing:.5px}
.space-mult-ctrl{display:flex;align-items:center;gap:8px}
.space-mult-ctrl .arrow{width:32px;height:32px;background:rgba(255,193,7,.22);border:1.5px solid rgba(255,193,7,.5);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--gold);transition:all .2s var(--ease)}
.space-mult-ctrl .arrow:active{transform:scale(.9)}
.space-mult-ctrl .val{font-family:'Poppins',sans-serif;font-size:14px;font-weight:900;color:var(--gold);min-width:52px;text-align:center;letter-spacing:.5px;text-shadow:0 0 10px var(--gold-glow)}
.space-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.space-quick button{padding:13px 4px;border-radius:11px;font-size:11px;font-weight:900;letter-spacing:.5px;color:#fff;border:1.5px solid rgba(255,255,255,.14);background:linear-gradient(160deg,#7c5cc9,#3d2374);transition:all .2s var(--ease);position:relative;text-transform:uppercase}
.space-quick button::before{content:'+';position:absolute;top:-6px;left:-6px;width:20px;height:20px;background:var(--grad-green);border-radius:50%;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px var(--green-glow)}
.space-quick button:active{transform:scale(.94)}
.space-bet-display{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(160deg,#5a3fbb,#3d2374);border:2px solid var(--gold);border-radius:22px;padding:12px 16px;margin-bottom:12px;box-shadow:0 0 20px rgba(255,193,7,.3)}
.space-bet-arrow{width:38px;height:38px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--gold);background:rgba(0,0,0,.35);color:var(--gold);font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:center;transition:all .2s var(--ease)}
.space-bet-arrow:active{transform:scale(.9)}
.space-bet-center{text-align:center;flex:1}
.space-bet-label{font-size:9px;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.72);margin-bottom:3px;font-weight:800}
.space-bet-amount{font-family:'Poppins',sans-serif;font-size:18px;font-weight:900;color:var(--gold);letter-spacing:.3px;text-shadow:0 0 10px var(--gold-glow)}
.space-pill{padding:6px 13px;border-radius:11px;font-family:'Poppins',sans-serif;font-size:12px;font-weight:900;letter-spacing:.5px;background:var(--grad-green);color:#fff;box-shadow:0 0 14px var(--green-glow)}
.cta-btn{width:100%;padding:17px;border:none;border-radius:26px;font-size:13px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--grad-green);color:#fff;box-shadow:0 12px 30px rgba(0,200,83,.5),inset 0 2px 0 rgba(255,255,255,.3);transition:all .22s var(--ease);text-shadow:0 1px 2px rgba(0,0,0,.3)}
.cta-btn:active{transform:scale(.98)}
.cta-btn:disabled{opacity:.55;cursor:not-allowed;animation:none}
.cta-btn svg{width:18px;height:18px;fill:currentColor}
.hist-strip{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.hist-strip::-webkit-scrollbar{display:none}
.hist-pill{flex-shrink:0;font-family:'Poppins',sans-serif;font-size:11px;font-weight:900;letter-spacing:.3px;padding:6px 13px;border-radius:10px;background:var(--grad-gold);color:#0a0a0a;box-shadow:0 0 10px var(--gold-glow)}
.hist-pill.blue{background:var(--grad-blue);color:#fff}
.hist-pill.purple{background:var(--grad-purple);color:#fff}

/* ============================================================
   MAHJONG
   ============================================================ */
.mj-shell{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;overflow:hidden}
.mj-shell.zeus{background:linear-gradient(180deg,#1a0a00 0%,#3d1a00 30%,#5c2a00 60%,#1a0a00 100%)}
.mj-shell.ocean{background:linear-gradient(180deg,#001020 0%,#003d6b 30%,#006699 60%,#001020 100%)}
.mj-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;min-height:0;display:flex;flex-direction:column;padding:0 12px;scrollbar-width:none}
.mj-body::-webkit-scrollbar{display:none}
.mj-multbar{display:flex;justify-content:space-around;align-items:center;padding:12px 16px;border-radius:22px 22px 0 0;border:3px solid;border-bottom:none;font-family:'Poppins',sans-serif;font-size:18px;font-weight:900;color:rgba(255,255,255,.72);flex-shrink:0}
.zeus .mj-multbar{background:linear-gradient(180deg,#8a4a00,#3d1a00);border-color:var(--gold);box-shadow:0 0 24px var(--gold-glow)}
.ocean .mj-multbar{background:linear-gradient(180deg,#006699,#002a4d);border-color:#2196f3;box-shadow:0 0 24px rgba(33,150,243,.5)}
.mj-mult{transition:all .35s var(--ease-out);transform:skewX(-8deg)}
.mj-mult.active{color:var(--gold);font-size:28px;text-shadow:0 0 22px var(--gold-glow);transform:skewX(-8deg) scale(1.2)}
.mj-board{position:relative;padding:14px 10px;border-radius:0 0 22px 22px;overflow:hidden;flex-shrink:0}
.zeus .mj-board{background:linear-gradient(160deg,#5c2a00 0%,#3d1a00 50%,#1a0a00 100%);border:3px solid var(--gold);border-top:none;box-shadow:inset 0 0 30px rgba(255,193,7,.2)}
.ocean .mj-board{background:linear-gradient(160deg,#003d6b 0%,#001a33 50%,#001020 100%);border:3px solid #2196f3;border-top:none;box-shadow:inset 0 0 30px rgba(33,150,243,.2)}
.mj-corner{position:absolute;width:36px;height:36px;z-index:10;pointer-events:none;opacity:.85}
.mj-corner.tl{top:4px;left:4px}
.mj-corner.tr{top:4px;right:4px;transform:scaleX(-1)}
.mj-corner.bl{bottom:4px;left:4px;transform:scaleY(-1)}
.mj-corner.br{bottom:4px;right:4px;transform:scale(-1,-1)}
.mj-corner svg{width:100%;height:100%}
.zeus .mj-corner svg{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold-glow))}
.ocean .mj-corner svg{fill:#2196f3;filter:drop-shadow(0 0 6px rgba(33,150,243,.7))}
.mj-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:relative;z-index:3}
.mj-tile{aspect-ratio:.86;border-radius:11px;display:flex;justify-content:center;align-items:center;font-size:18px;font-weight:900;color:#000;position:relative;overflow:hidden;animation:tileIn .4s var(--ease-out) both;transition:all .3s var(--ease)}
.mj-tile::after{content:'';position:absolute;top:4px;left:4px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.75)}
.mj-tile svg{width:62%;height:62%}
.mj-tile.zeus-tile{background:linear-gradient(160deg,#fff,#ffd54f);border:1.5px solid #ff9800;box-shadow:0 4px 9px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.mj-tile.ocean-tile{background:linear-gradient(160deg,#e0f4ff,#80d8ff);border:1.5px solid #2196f3;box-shadow:0 4px 9px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.7)}
.mj-tile.wild{background:radial-gradient(circle at 40% 30%,#ffd700,#ff8c00);border-color:#fff;font-size:9px;color:#5c2a00;font-weight:900;box-shadow:0 0 14px var(--gold-glow)}
.mj-tile.scatter{background:radial-gradient(circle,#9c27b0,#4a148c);border-color:var(--gold);box-shadow:0 0 12px rgba(156,39,176,.5)}
.zeus .mj-tile.scatter{background:radial-gradient(circle,#ff6f00,#b30000)}
.ocean .mj-tile.scatter{background:radial-gradient(circle,#2196f3,#0d47a1)}
.mj-tile.scatter svg{width:62%;height:62%;fill:var(--gold)}
.mj-tile.blackdragon{background:linear-gradient(160deg,#1a1a1a,#000);border-color:var(--gold);animation:floatY 1.6s ease-in-out infinite;box-shadow:0 0 20px var(--gold-glow)}
.mj-tile.blackdragon svg{width:72%;height:72%;fill:var(--gold)}
.mj-tile.win{background:linear-gradient(160deg,#fff8e7,#ffd700);border-color:var(--gold);animation:winGlow .7s ease-in-out infinite}
.mj-tile.spin{animation:tileSpin .18s linear infinite}
.mj-greenbar{height:44px;margin:0 0 12px;border:2px solid var(--gold);border-radius:22px;display:flex;justify-content:center;align-items:center;font-family:'Poppins',sans-serif;font-size:14px;font-weight:900;letter-spacing:1.2px;color:#fff;text-transform:uppercase;transform:translateY(-14px);opacity:0;transition:all .5s var(--ease-out);flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.mj-greenbar.show{transform:translateY(0);opacity:1;animation:bounceIn .5s var(--ease-bounce)}
.zeus .mj-greenbar{background:var(--grad-gold);color:#0a0a0a}
.ocean .mj-greenbar{background:linear-gradient(180deg,#00bcd4,#006699)}
.mj-controls{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px calc(var(--safe-bottom) + 12px);border-top:3px solid;position:relative}
.zeus .mj-controls{background:linear-gradient(180deg,#3d1a00,#1a0a00);border-color:var(--gold)}
.ocean .mj-controls{background:linear-gradient(180deg,#003d6b,#001020);border-color:#2196f3}
.mj-betcol{display:flex;flex-direction:column;align-items:center;gap:5px}
.mj-bet-label{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:800}
.mj-bet-val{font-family:'Poppins',sans-serif;font-size:14px;font-weight:900;color:var(--gold);letter-spacing:.3px;text-shadow:0 0 10px var(--gold-glow)}
.mj-win-num{font-family:'Poppins',sans-serif;font-size:14px;font-weight:900;color:var(--green);letter-spacing:.3px;text-shadow:0 0 10px var(--green-glow)}
.mj-round{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.4);border:2px solid var(--gold);color:var(--gold);font-size:20px;font-weight:900;display:flex;justify-content:center;align-items:center;transition:all .2s var(--ease);box-shadow:0 0 12px var(--gold-glow)}
.mj-round:active{transform:scale(.9)}
.mj-spinwrap{display:flex;flex-direction:column;align-items:center;position:relative}
.mj-spin-hint{position:absolute;top:-22px;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;font-weight:900;color:#fff;background:rgba(0,0,0,.75);padding:4px 12px;border-radius:8px;white-space:nowrap;border:1px solid var(--gold)}
.mj-spin{width:100px;height:100px;border-radius:50%;border:4px solid #fff;font-family:'Poppins',sans-serif;font-size:12px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;color:#0a0a0a;position:relative;transition:all .22s var(--ease);box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.5),0 0 30px var(--gold-glow)}
.mj-spin:active{transform:scale(.9)}
.mj-spin:disabled{opacity:.6;cursor:not-allowed}
.mj-spin svg{width:28px;height:28px;fill:currentColor;margin-bottom:2px}
.mj-spin.zeus-spin{background:var(--grad-gold);color:#0a0a0a}
.mj-spin.ocean-spin{background:linear-gradient(160deg,#64b5f6,#2196f3 45%,#0d47a1 100%);color:#fff}
.mj-spin:not(:disabled){animation:btnPulse 2.4s infinite}
.mj-infobar{flex-shrink:0;background:linear-gradient(160deg,#0a0a0a,#1a1a22);padding:12px 20px calc(var(--safe-bottom) + 12px);display:flex;justify-content:space-between;font-size:11px;font-weight:800;letter-spacing:.5px;color:rgba(255,255,255,.85);border-top:1.5px solid rgba(255,193,7,.25)}
.mj-infobar b{font-family:'Poppins',sans-serif;font-weight:900;color:var(--gold);letter-spacing:.3px;text-shadow:0 0 8px var(--gold-glow)}

/* ============================================================
   WILD BANDITO
   ============================================================ */
.wb-wrap{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;z-index:60}
.wb-bg{position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 15% 20%,rgba(255,213,79,.18) 0%,transparent 28%),radial-gradient(circle at 85% 25%,rgba(255,120,180,.28) 0%,transparent 32%),radial-gradient(circle at 50% 85%,rgba(156,39,176,.25) 0%,transparent 38%),radial-gradient(circle at 10% 80%,rgba(0,150,136,.18) 0%,transparent 30%),linear-gradient(180deg,#3a0518 0%,#8a1040 20%,#c2185b 50%,#8a1040 80%,#3a0518 100%)}
.wb-bg::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 10% 30%,rgba(255,255,255,.08) 2px,transparent 2px),radial-gradient(circle at 30% 60%,rgba(255,255,255,.06) 1px,transparent 1px),radial-gradient(circle at 70% 20%,rgba(255,255,255,.08) 2px,transparent 2px);background-size:200px 200px}
.wb-sun{position:absolute;top:8%;right:8%;width:110px;height:110px;z-index:0;pointer-events:none;background:radial-gradient(circle,#fff8e7 0%,#ffd54f 30%,rgba(255,152,0,.4) 60%,transparent 70%);border-radius:50%;filter:blur(2px);animation:pulseGlow 6s ease-in-out infinite}
